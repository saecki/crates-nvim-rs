[workspace]
resolver = "2"
members = [
    "crates/*",
    "fuzz",
]

[workspace.dependencies]
ide = { package = "dingey-ide", path = "crates/ide" }
toml = { package = "dingey-toml", path = "crates/toml" }
semver = { package = "dingey-semver", path = "crates/semver", features = ["serde"] }
common = { package = "dingey-common", path = "crates/common" }

bumpalo = { version = "3.17.0", features = ["collections"] }
indexmap = "2.8.0"
memchr = "2.7.5"
pretty_assertions = "1.4.1"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
unicode-width = "0.2.0"

[profile.release]
strip = true
